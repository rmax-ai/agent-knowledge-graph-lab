# node-types.yaml — Entity node types for v1

nodes:
  - kind: concept
    description: Abstract or concrete idea
    required_fields: [id, kind, title, status]
    optional_fields: [summary, confidence, tags]

  - kind: claim
    description: Assertion that can be supported or contradicted
    required_fields: [id, kind, title, status]
    optional_fields: [confidence, tags]

  - kind: evidence
    description: Supporting material for a claim
    required_fields: [id, kind, title, status]
    optional_fields: [summary, tags]

  - kind: source
    description: Origin document or reference
    required_fields: [id, kind, title, status]
    optional_fields: [summary, tags]

  - kind: decision
    description: Recorded architectural or design decision
    required_fields: [id, kind, title, status]
    optional_fields: [summary, tags]

  - kind: technology
    description: Tool, library, or platform
    required_fields: [id, kind, title, status]
    optional_fields: [summary, tags]

  - kind: project
    description: Named initiative or workstream
    required_fields: [id, kind, title, status]
    optional_fields: [summary, tags]
